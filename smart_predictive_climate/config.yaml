# Home Assistant App configuration: Smart Adaptive & Predictive Climate.
# Independent of the other Apps in this repository: its own slug, /data folder, backups and versions.
name: Smart Adaptive & Predictive Climate
version: "0.1.0"
slug: smart_predictive_climate
description: >-
  Observes your rooms, learns how each one gains and loses heat, and predicts
  room temperatures from the sensors, the weather forecast and the heating you
  already have. The forecasts and recommendations are published as native Home
  Assistant entities through its small companion integration. It only
  observes, learns and predicts: it never controls a thermostat, a valve, a
  switch or any other device.
url: https://github.com/havanissa/HomeAssistant/tree/main/smart_predictive_climate
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
startup: application
boot: auto
# The base image runs S6 overlay v3 as PID 1.
init: false

# Ingress only: the interface opens from the Home Assistant sidebar, through Home Assistant's own login.
# No host port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-thermometer-outline
panel_title: Predictive Climate
panel_admin: true

# Home Assistant Core API through the Supervisor proxy (SUPERVISOR_TOKEN). The backend sends only allowlisted
# websocket commands (backend/spc/ha.py): reads (states, registries, recorded history and statistics, weather
# forecasts), event subscriptions and the companion integration's publishing protocol. There is no service call:
# the App cannot control a device.
homeassistant_api: true
hassio_api: false

backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
