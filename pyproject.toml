[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Two Home Assistant test suites that must run in separate processes (both import
# ``custom_components.smart_occupancy``: the companion, and the engine harness in tests/engine):
#   python scripts/run_tests.py tests/companion
#   python scripts/run_tests.py tests/engine
testpaths = ["tests/companion"]
