# Home Assistant App configuration: Smart Occupancy Detection.
# Independent of Smart Comfort (slug smart_lighting): its own slug, /data folder, backups and versions.
name: Smart Occupancy Detection
version: "0.2.0"
slug: smart_occupancy_detection
description: >-
  Room occupancy detection from the sensors you already have (motion, mmWave
  presence, doors, PC activity, bed sensors), published as native Home
  Assistant entities through its small companion integration. It only
  detects: it never controls a light, a cover, a switch or any other device.
url: https://github.com/havanissa/HomeAssistant/tree/main/smart_occupancy_detection
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
startup: application
boot: auto
# The base image runs S6 overlay v3 as PID 1.
init: false

# Ingress only: the interface opens from the Home Assistant sidebar, through Home Assistant's own login.
# No host port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:motion-sensor
panel_title: Occupancy
panel_admin: true

# Home Assistant Core API through the Supervisor proxy (SUPERVISOR_TOKEN). The backend sends only allowlisted
# websocket commands (backend/sod/ha.py): reads, event subscriptions and the companion integration's publishing
# protocol. There is no service call: the App cannot control a device.
homeassistant_api: true
hassio_api: false

backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
