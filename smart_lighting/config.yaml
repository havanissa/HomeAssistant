# Home Assistant App configuration: Smart Occupancy & Lighting (Phase A3.2).
name: Smart Occupancy & Lighting
version: "0.5.0"
slug: smart_lighting
description: >-
  Web interface and occupancy engine for Smart Occupancy & Lighting. Room,
  device and presence management saved in the existing integration, a live
  occupancy debugger, an optional floor plan, and the occupancy engine (shadow
  mode until a reviewed handover). It never controls a device.
url: https://github.com/havanissa/HomeAssistant/tree/main/smart_lighting
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
startup: application
boot: auto
# The base image runs S6 overlay v3 as PID 1.
init: false

# Ingress only: the interface opens from the Home Assistant sidebar, through
# Home Assistant's own login. No host port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:lightbulb-auto
panel_title: Smart Lighting
panel_admin: true

# Home Assistant Core API through the Supervisor proxy (SUPERVISOR_TOKEN).
# The backend sends only allowlisted websocket commands (backend/ha.py): reads,
# the Recorder history (bounded), the integration's validated room and
# presence configuration commands and its fenced occupancy bridge (Phase A3.2).
homeassistant_api: true
# The basic Supervisor endpoints used (/addons/self/info, /info) need no
# extra Supervisor API access.
hassio_api: false

backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
