# Home Assistant App configuration: Smart Comfort (Phase A7.0), formerly Smart Occupancy & Lighting.
# The slug stays smart_lighting: it identifies the installed App, its /data folder and its backups.
name: Smart Comfort
version: "0.10.0"
slug: smart_lighting
description: >-
  Smart Comfort, intelligent home automation: rooms, presence, lighting, moods,
  switches, curtains, occupancy predictions and climate observation, with an
  optional floor plan. Devices are commanded only through the companion
  integration's fenced executor; thermostats are observed, never controlled.
url: https://github.com/havanissa/HomeAssistant/tree/main/smart_lighting
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
startup: application
boot: auto
# The base image runs S6 overlay v3 as PID 1.
init: false

# Ingress only: the interface opens from the Home Assistant sidebar, through
# Home Assistant's own login. No host port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: Smart Comfort
panel_admin: true

# Home Assistant Core API through the Supervisor proxy (SUPERVISOR_TOKEN).
# The backend sends only allowlisted websocket commands (backend/ha.py): reads,
# the Recorder history (bounded), the integration's validated configuration
# commands and its fenced occupancy, lighting, curtain and forecast bridges.
homeassistant_api: true
# The basic Supervisor endpoints used (/addons/self/info, /info) need no
# extra Supervisor API access.
hassio_api: false

backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
