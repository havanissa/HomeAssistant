name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Harness default (minimum supported release line).
          - homeassistant: "2026.10.4"
            frontend: ""
          # Target release, with the frontend build it pins.
          - homeassistant: "2026.11.1"
            frontend: "20261028.5"
    name: tests (HA ${{ matrix.homeassistant }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements_test.txt
      - run: pip install "homeassistant==${{ matrix.homeassistant }}"
      - if: matrix.frontend != ''
        run: pip install "home-assistant-frontend==${{ matrix.frontend }}"
      # Libraries this Home Assistant release declares for the components the tests start (MQTT).
      - run: pip install $(python scripts/component_requirements.py mqtt hassio)
      - run: python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: python scripts/run_tests.py -p no:cacheprovider
