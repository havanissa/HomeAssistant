# Test entities for the Automation Builder end-to-end checks, as a Home Assistant package. Used by the disposable
# Home Assistant of the local stack (configuration.yaml next to this file) and by the Home Assistant OS test VM
# (copied to /config/packages/ab_test.yaml). Never install this in a production Home Assistant.
#
# Nothing here is occupancy detection: binary_sensor.sod_kamar_occupied is a plain template sensor that is named
# and behaves like one of Smart Occupancy Detection's entities (attribute "fresh"). The checks against the real
# Smart Occupancy Detection use its own entities instead (sod_checks.py).
demo:
input_boolean:
  e2e_window:
    name: Window (test driver)
  test_motion:
    name: Motion (test driver)
  occ_kamar:
    name: Kamar occupied (test driver)
  occ_available:
    name: Occupancy available (test driver)
    initial: true
  occ_fresh:
    name: Occupancy fresh (test driver)
    initial: true
  flaky_state:
    name: Flaky lamp state
  drop_commands:
    name: Drop the flaky lamp's commands
  manual_override:
    name: Manual override
  guest_mode:
    name: Guest mode
  ab_door:
    name: Door (test driver)
  slow_done:
    name: Slow script finished
  sofa_zone_drv:
    name: Sofa zone (test driver)
  kitchen_zone_drv:
    name: Kitchen zone (test driver)
  rain_drv:
    name: Rain (test driver)
input_number:
  test_lux:
    name: Lux (test driver)
    min: 0
    max: 2000
    initial: 400
  script_level:
    name: Level set by the test script
    min: 0
    max: 100
    initial: 0
  radar_x:
    name: Radar x (test driver)
    min: -4000
    max: 4000
    initial: 0
  radar_y:
    name: Radar y (test driver)
    min: 0
    max: 6000
    initial: 0
  wind_drv:
    name: Wind (test driver)
    min: 0
    max: 40
    initial: 2
  outdoor_lux_drv:
    name: Outdoor lux (test driver)
    min: 0
    max: 120000
    initial: 30000
  awning_pos:
    name: Awning position (test driver)
    min: 0
    max: 100
    initial: 0
input_button:
  wall_switch:
    name: Wall switch
  heat_resume:
    name: Resume heating
input_select:
  heat_mode:
    name: Heating mode
    options: [Day, Night, Away]
  mood:
    name: Mood
    options: [Dagur, Hygge, Nátt]
    initial: Dagur
  main_mood:
    name: Main mood
    options: [Auto, Dagur, Hygge, Nátt]
    initial: Dagur
  cover_mode:
    name: Cover mode
    options: [Daylight, Privacy, Sleep]
    initial: Daylight
input_datetime:
  ab_wake:
    name: Wake time
    has_time: true
    has_date: false
script:
  ab_test_script:
    alias: AB test script
    fields:
      level:
        description: A number
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.script_level
        data:
          value: "{{ level | default(1) }}"
  ab_slow_script:
    alias: AB slow script
    sequence:
      - delay: 3
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.slow_done
template:
  - binary_sensor:
      - name: sod_kamar_occupied
        unique_id: ab_e2e_sod_kamar_occupied
        device_class: occupancy
        state: "{{ is_state('input_boolean.occ_kamar', 'on') }}"
        availability: "{{ is_state('input_boolean.occ_available', 'on') }}"
        attributes:
          fresh: "{{ is_state('input_boolean.occ_fresh', 'on') }}"
      - name: Test motion
        unique_id: ab_e2e_test_motion
        device_class: motion
        state: "{{ is_state('input_boolean.test_motion', 'on') }}"
      - name: Test door
        unique_id: ab_e2e_test_door
        device_class: door
        state: "{{ is_state('input_boolean.ab_door', 'on') }}"
      - name: Sofa zone
        unique_id: ab_e2e_sofa_zone
        device_class: occupancy
        state: "{{ is_state('input_boolean.sofa_zone_drv', 'on') }}"
      - name: Kitchen zone
        unique_id: ab_e2e_kitchen_zone
        device_class: occupancy
        state: "{{ is_state('input_boolean.kitchen_zone_drv', 'on') }}"
      - name: Test rain
        unique_id: ab_e2e_test_rain
        device_class: moisture
        state: "{{ is_state('input_boolean.rain_drv', 'on') }}"
    sensor:
      - name: Test lux
        unique_id: ab_e2e_test_lux
        unit_of_measurement: lx
        device_class: illuminance
        state: "{{ states('input_number.test_lux') }}"
      - name: Radar target x
        unique_id: ab_e2e_radar_x
        unit_of_measurement: mm
        state: "{{ states('input_number.radar_x') | int }}"
      - name: Radar target y
        unique_id: ab_e2e_radar_y
        unit_of_measurement: mm
        state: "{{ states('input_number.radar_y') | int }}"
      - name: Test wind
        unique_id: ab_e2e_test_wind
        unit_of_measurement: m/s
        device_class: wind_speed
        state: "{{ states('input_number.wind_drv') }}"
      - name: Outdoor lux
        unique_id: ab_e2e_outdoor_lux
        unit_of_measurement: lx
        device_class: illuminance
        state: "{{ states('input_number.outdoor_lux_drv') }}"
    cover:
      - name: Test awning
        unique_id: ab_e2e_test_awning
        device_class: awning
        position: "{{ states('input_number.awning_pos') | int }}"
        open_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.awning_pos
            data:
              value: 100
        close_cover:
          - action: input_number.set_value
            target:
              entity_id: input_number.awning_pos
            data:
              value: 0
        set_cover_position:
          - action: input_number.set_value
            target:
              entity_id: input_number.awning_pos
            data:
              value: "{{ position }}"
    light:
      - name: Flaky lamp
        unique_id: ab_e2e_flaky_lamp
        state: "{{ is_state('input_boolean.flaky_state', 'on') }}"
        turn_on:
          - if: "{{ is_state('input_boolean.drop_commands', 'off') }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.flaky_state
        turn_off:
          - if: "{{ is_state('input_boolean.drop_commands', 'off') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.flaky_state
