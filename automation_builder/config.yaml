# Home Assistant App configuration: Automation Builder.
# Independent of Smart Comfort (slug smart_lighting) and of Smart Occupancy Detection: its own slug, container,
# /data folder, backups and versions. It needs neither of them.
name: Automation Builder
version: "0.3.0"
slug: automation_builder
description: >-
  A visual IF / AND-OR / THEN rule editor with graphical designers for lights
  (mood, presence and light-level matrices) and covers (sun angle, cover modes).
  Each device becomes one native Home Assistant automation, validated and
  deployed only when you ask for it.
url: https://github.com/havanissa/HomeAssistant/tree/main/automation_builder
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
startup: application
boot: auto
# The base image runs S6 overlay v3 as PID 1.
init: false

# Ingress only: the interface opens from the Home Assistant sidebar, through Home Assistant's own login.
# No host port is exposed.
ingress: true
ingress_port: 8099
panel_icon: mdi:sitemap-outline
panel_title: Automation Builder
panel_admin: true

# Home Assistant Core API through the Supervisor proxy (SUPERVISOR_TOKEN). The backend sends only allowlisted
# websocket commands (reads, event subscriptions, validate_config, and blueprint/save for its own folder when the
# user installs a blueprint) and uses one HTTP endpoint: Home Assistant's automation configuration endpoint, for
# ids that start with "automation_builder_" (backend/ab/ha.py).
# There is no service call, and no access to Home Assistant's configuration folder (no "map").
homeassistant_api: true
hassio_api: false

backup: hot
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
